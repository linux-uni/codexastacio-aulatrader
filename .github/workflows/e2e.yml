name: Pruebas navegador AulaTrader
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.57.0 lightweight-charts@5.3.0
      - name: Copiar dependencia gráfica para pruebas
        run: |
          mkdir -p vendor
          cp node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js vendor/
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar interacción real de navegador móvil
        run: node tests/e2e.cjs
