name: Calidad AulaTrader v2
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar pruebas de lógica y estructura
        run: node --test tests/*.test.js
      - name: Validar sintaxis del módulo de riesgo y el service worker
        run: |
          node --check risk.js
          node --check sw.js
