name: Publicar AulaTrader en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Instalar gráficos de código abierto (v5.3.0)
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund lightweight-charts@5.3.0
          test -s node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js
      - name: Preparar archivos web
        run: |
          mkdir -p _site/vendor
          cp index.html favicon.svg dante-avatar.svg dante-realista.webp dante-help-futurista.webp risk.js lab-v3.js lab-ui-v3.js v3-addon.js academy-v3.js v2.css v3.css manifest.webmanifest app-icon.svg sw.js _site/
          cp node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js _site/vendor/
          cp vendor/TRADINGVIEW_NOTICE vendor/APACHE-2.0.txt _site/vendor/
          touch _site/.nojekyll
          touch _site/.nojekyll
      - name: Subir sitio estatico
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
