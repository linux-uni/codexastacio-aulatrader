name: Publicar AulaTrader en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos web
        run: |
          mkdir -p _site
          cp index.html favicon.svg dante-avatar.svg dante-realista.webp dante-help-futurista.webp risk.js v2.css manifest.webmanifest sw.js _site/
          touch _site/.nojekyll
      - name: Subir sitio estatico
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
